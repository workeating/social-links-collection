<script>
const seed=[{id:'yt',site:'YouTube',url:'https://www.youtube.com/watch?v=Y5P4EG5RkUA',date:'2026-10-12',title:'鏡新聞直播專訪沈伯洋：沈蔣辯論與「當事人」Call-in',description:'節目由廖雅玉主持，訪問台北市長候選人沈伯洋；標題聚焦「當事人」連線澄清與沈蔣辯論。',summary:'說明欄列出沈伯洋及王義川等來賓。聊天室截圖可見觀眾支持訊息與表情，也有人詢問直播是否開始。此摘要依影片標題、說明欄及提供的聊天室截圖整理，未取得完整影片逐字稿。',image:'youtube-screenshot.png',tags:['有話鏡來講','政治'],favorite:false},{id:'fb',site:'Facebook',url:'https://www.facebook.com/story.php?story_fbid=1132384486028455&id=100077707422776&post_id=100077707422776_1132384486028455&rdid=iynX9V0C7rWGzMbA#',date:'2026-10-13',title:'黃暐瀚訪問沈伯洋：「市長你給我聽好了」是否保留？',description:'分享 10/12 專訪片段：黃暐瀚問沈伯洋若當選市長，會否保留市民直接提問的「市長你給我聽好了」形式；沈伯洋回答想保留，方式可以再討論。',summary:'貼文以沈伯洋說的日文「いろいろ」（各式各樣）開玩笑，詢問大家是否都聽得懂。留言多延伸日語詞義與發音梗，如「還好不是ケロケロ」「不可以色色」；原作者補上影片連結並標示約 47:00。',image:'',images:['facebook-screenshot.png'],tags:['訪談','日語梗'],favorite:false},{id:'th1',site:'Threads',url:'https://www.threads.com/@markr9988/post/DeZQ_B9ivvN?xmt=AQG0NTaP6PXVyfMLiu2sy0aqkEQ5T1r7TWbVipXL1Tab6IRzeI3jIwcAr9ATgC18Pg48ZMod&slof=1',date:'2026-10-13',title:'30多年好友推薦沈伯洋：正義感、執行力、堅持',description:'轉述沈伯洋 30 多年好友陳先生的推薦，列出正義感、執行力與堅持三個特點，認為他適合當市長。',summary:'可見留言大多支持或認同；有人希望也聽到蔣萬安的同學或老友談他的往事。另有留言認為沈伯洋原可選擇更容易賺錢的路，卻投入公共事務，值得肯定。',image:'',images:['threads-friend-screenshot.png'],tags:['沈伯洋','好友推薦'],favorite:false},{id:'th2',site:'Threads',url:'https://www.threads.com/@letsgogrizzlies/post/DeZNXLFkoAh?xmt=AQG02iG2WreRt2UxcN0oLEEjIcf84Kx4lSLSG6muHJNnGitTfD-vddf2fJNXm2f7YP5oTC-j&slof=1',date:'2026-10-13',title:'沈伯洋與青梅竹馬連線聊往事，發文者笑稱選舉變歡樂',description:'貼文分享沈伯洋與老同學在節目連線、聊起往事的片段，形容兩人像阿宅聊天，讓選舉氣氛變得輕鬆。',summary:'原作者補充，陳同學和沈伯洋想法相近，也提到沈伯洋放棄較容易賺錢的選項，選擇投入艱難的公共工作。留言有人詢問節目名稱，也有網友稱讚兩人相似、支持其選擇。',image:'',images:['threads-classmate-chat-screenshot.png'],tags:['沈伯洋','同學連線'],favorite:false},{id:'th3',site:'Threads',url:'https://www.threads.com/@sunnyjia314188/post/DeZOuHYkvcf?xmt=AQG0Bd5PjcDr_7nhbwYbif_VxFF3RHpcSvwWfBFuPkY15ioOzY-dGJ3r0j3wMUSt5FWk0JTK&slof=1',date:'2026-10-13',title:'同學談沈伯洋：聰明人有更多賺錢方式，何必做吃力不討好的事',description:'貼文轉述沈伯洋同學的看法：真正聰明的人有許多賺更多錢的方式，沈伯洋仍選擇投入吃力不討好的公共工作，並呼籲台北市民珍惜。',summary:'留言多表示認同與支持；有人稱這番話一針見血，表示會努力拉票、台灣人不能冷漠，也有人批評只用金錢衡量人生的觀念。',image:'',images:['threads-classmate-screenshot.png'],tags:['沈伯洋','市長選舉'],favorite:false}];
let records=JSON.parse(localStorage.getItem('social-links-v1')||'null')||seed;let mode='all';const $=id=>document.getElementById(id);if(!localStorage.getItem('social-links-feed-sync-v3')){for(const row of records){const fresh=seed.find(x=>x.id===row.id);if(fresh){for(const key of ['url','date','title','description','summary','tags'])row[key]=fresh[key];row.images=[...new Set([...(row.images||[]),...(row.image?[row.image]:[]),...(fresh.images||[]),...(fresh.image?[fresh.image]:[])])];if(row.id==='fb'||row.id==='th1'||row.id==='th3')row.url=fresh.url}}localStorage.setItem('social-links-v1',JSON.stringify(records));localStorage.setItem('social-links-feed-sync-v3','1')}if(!localStorage.getItem('social-links-feed-th2-shot-v1')){for(const row of records){if(row.id==='th2'){const fresh=seed.find(x=>x.id==='th2');row.images=[...new Set([...(row.images||[]),...(row.image?[row.image]:[]),...(fresh.images||[])])];row.url=fresh.url}}localStorage.setItem('social-links-v1',JSON.stringify(records));localStorage.setItem('social-links-feed-th2-shot-v1','1')}function save(){localStorage.setItem('social-links-v1',JSON.stringify(records));render()}function render(){let q=$('search').value.toLowerCase(),p=$('platform').value,j=$('jcFilter').value,from=$('dateFrom').value,to=$('dateTo').value;let items=records.filter(x=>(mode==='all'||x.favorite)&& (p==='全部'||x.site===p)&&(j==='all'||(j==='yes'?!!x.isJC:!x.isJC))&&(!from||(x.date&&x.date>=from))&&(!to||(x.date&&x.date<=to))&&(`${x.title} ${x.description} ${x.site} ${(x.tags||[]).join(' ')}`).toLowerCase().includes(q));$('count').textContent=records.length; $('grid').innerHTML=items.length?items.map(x=>{const pics=Array.isArray(x.images)&&x.images.length?x.images:(x.image?[x.image]:[]);const thumbHtml=pics.length?'<div class="thumbs">'+pics.map((src,i)=>'<img src="'+esc(src)+'" alt="'+esc(x.title||'Screenshot')+' '+(i+1)+'" data-shot="'+esc(src)+'">').join('')+'</div>':'尚未加入截圖';return `<article class="card"><div class="thumb">${thumbHtml}</div><div class="body"><div class="top"><span class="platform">${esc(x.site)}</span><button class="star ${x.favorite?'on':''}" data-star="${x.id}" title="我的最愛">${x.favorite?'★':'☆'}</button></div><h2>${esc(x.title||'未命名連結')}</h2><div class="meta">發布日期：${x.date||'待補'}</div><p class="desc">${esc(x.description||'')}</p>${x.summary?`<div class="note"><b>重點</b><br>${esc(x.summary)}</div>`:''}<div class="tags">${(x.tags||[]).map(t=>'#'+esc(t)).join('　')}</div><div class="actions"><a href="${esc(x.url)}" target="_blank" rel="noopener">開啟原始連結 ↗</a><button class="edit" data-edit="${x.id}">編輯</button></div></div></article>`}).join(''):'<div class="empty">沒有符合條件的連結</div>';document.querySelectorAll('[data-shot]').forEach(img=>img.onclick=()=>{$('large').src=img.dataset.shot;$('zoom').classList.add('open')});document.querySelectorAll('[data-star]').forEach(b=>b.onclick=()=>{let x=records.find(r=>r.id===b.dataset.star);x.favorite=!x.favorite;save()});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openForm(records.find(r=>r.id===b.dataset.edit)))}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openForm(x){$('form').reset();$('id').value=x?.id||'';$('formtitle').textContent=x?'編輯連結':'新增連結';$('jc').checked=!!x?.isJC;if(x){for(let k of ['url','site','date','title','description','summary'])$(k).value=x[k]||'';$('image').value=x.image||'';$('tags').value=(x.tags||[]).join(', ')}$('modal').classList.add('open')}$('new').onclick=()=>openForm();$('close').onclick=()=>$('modal').classList.remove('open');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};$('form').onsubmit=e=>{e.preventDefault();let id=$('id').value||crypto.randomUUID(),old=records.find(x=>x.id===id);let x={id,url:$('url').value,site:$('site').value,date:$('date').value,title:$('title').value,description:$('description').value,summary:$('summary').value,image:$('image').value,images:old?.images||[],isJC:$('jc').checked,tags:$('tags').value.split(',').map(s=>s.trim()).filter(Boolean),favorite:old?.favorite||false};if(old)records=records.map(r=>r.id===id?x:r);else records.unshift(x);$('modal').classList.remove('open');save()};$('search').oninput=render;$('platform').onchange=render;$('jcFilter').onchange=render;$('dateFrom').onchange=render;$('dateTo').onchange=render;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{mode=b.dataset.filter;document.querySelectorAll('.pill').forEach(z=>z.classList.toggle('active',z===b));render()});render();
